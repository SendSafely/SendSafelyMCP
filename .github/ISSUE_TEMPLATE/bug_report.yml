name: Bug report
description: Something in @sendsafely/mcp-server-local does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security issues here. Use the SendSafely Bug Reporting Form instead (see SECURITY.md).
        Please redact SendSafely URLs, package IDs, file names and anything else from your account.
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `npm ls @sendsafely/mcp-server-local`
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client and version
      placeholder: Claude Desktop 1.2.3, Claude Code 2.1.80, Cursor 2.0, ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error text from the client's MCP log
      render: text
